# Public deployment on one Linux host with Docker. See "Deploy" in README.md:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# The worker runs fix sandboxes through the host's Docker (the socket is mounted), and those sandboxes bind-mount
# checkouts from ARCHAEO_DATA, so that folder is mounted at the same path on the host and in the containers.
name: archaeo-prod

x-app: &app
  build:
    context: .
    args:
      NEXT_PUBLIC_API_URL: /api
  image: archaeo:latest
  env_file: .env.production
  environment: &app-env
    DATABASE_URL: postgresql://archaeo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/archaeo
    REDIS_URL: redis://redis:6379
    WORKSPACE_DIR: ${ARCHAEO_DATA:-/srv/archaeo}/workspace
    TMPDIR: ${ARCHAEO_DATA:-/srv/archaeo}/tmp
    API_PORT: "4000"
    API_URL: http://api:4000
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: archaeo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: archaeo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archaeo -d archaeo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: pnpm db:deploy
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: sh -c 'mkdir -p "$$WORKSPACE_DIR" "$$TMPDIR" && exec pnpm --filter @archaeo/api start'
    volumes:
      - ${ARCHAEO_DATA:-/srv/archaeo}:${ARCHAEO_DATA:-/srv/archaeo}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    command: sh -c 'mkdir -p "$$WORKSPACE_DIR" "$$TMPDIR" && exec pnpm --filter @archaeo/worker start'
    volumes:
      - ${ARCHAEO_DATA:-/srv/archaeo}:${ARCHAEO_DATA:-/srv/archaeo}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    <<: *app
    command: pnpm --filter @archaeo/web start
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.8
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
